<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode Calendar</title>
  <style>
    :root { color-scheme: dark; --bg: #111318; --panel: #1b1f29; --line: #303747; --ink: #e9edf5; --muted: #98a2b3; --accent: #8ed0ff; }
    * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; }
    header { padding: 22px 28px 14px; border-bottom: 1px solid var(--line); } h1 { margin: 0 0 6px; font-size: 22px; } p { color: var(--muted); margin: 0; }
    main { padding: 22px 28px; overflow-x: auto; } .toolbar { display: flex; gap: 12px; margin-bottom: 18px; align-items: center; } select, button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
    .week { min-width: 820px; display: grid; grid-template-columns: 72px repeat(7, minmax(110px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .cell { min-height: 72px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; } .head { min-height: auto; color: var(--accent); font-weight: 650; } .hour { color: var(--muted); text-align: right; }
    .session { display: block; margin: 4px 0; padding: 7px; border-left: 3px solid var(--accent); border-radius: 4px; background: #23364a; cursor: pointer; } .session:focus { outline: 2px solid var(--accent); outline-offset: 2px; } .session strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .session small { color: #b9d6e8; }
    dialog { max-width: 920px; width: calc(100% - 32px); max-height: 90vh; overflow: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 20px; } dialog::backdrop { background: #0009; }
    .detail-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 18px; } .detail-head h2 { margin: 0 0 6px; } .muted { color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 14px 0 20px; } .stat { padding: 12px; background: #151923; border: 1px solid var(--line); border-radius: 7px; } .stat b { display: block; font-size: 18px; margin-top: 4px; }
    .detail-section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; } .detail-section h3 { margin: 0 0 10px; font-size: 14px; color: var(--accent); }
    .timeline { display: grid; gap: 8px; } .event { padding: 10px 12px; border-left: 3px solid #56647a; background: #151923; border-radius: 4px; } .event.user { border-left-color: #b7e986; } .event.assistant { border-left-color: var(--accent); } .event.tool { border-left-color: #e5b86f; } .event-title { font-weight: 650; } .event-text { margin-top: 6px; color: var(--muted); white-space: pre-wrap; max-height: 140px; overflow: auto; }
    details { margin-top: 16px; } details pre { white-space: pre-wrap; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header><h1>OpenCode Calendar</h1><p>ローカルのOpenCodeセッションを読み取り専用で表示</p></header>
  <main><div class="toolbar"><button id="reload">再読み込み</button><span id="meta">読み込み中...</span></div><div id="calendar"></div></main>
  <dialog id="detail"><button onclick="detail.close()">閉じる</button><div id="detail-body"></div></dialog>
  <script>
    const calendar = document.querySelector('#calendar'), meta = document.querySelector('#meta'), detail = document.querySelector('#detail'), body = document.querySelector('#detail-body');
    const days = ['日','月','火','水','木','金','土'];
    function dayStart(date) { const copy = new Date(date); copy.setHours(0,0,0,0); const day = copy.getDay() || 7; copy.setDate(copy.getDate() - day + 1); return copy; }
    function money(value) { return typeof value === 'number' && Number.isFinite(value) ? `$${value.toFixed(2)}` : '-'; }
    const serviceBase = location.pathname.startsWith('/api/extensions/') ? location.pathname.replace(/\/ui\/?$/, '/service') : '';
    const timezoneName = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    async function load() { const response = await fetch(serviceBase + '/api/calendar?timezone=' + encodeURIComponent(timezoneName)); const data = await response.json(); if (!response.ok) throw new Error(data.error || '取得に失敗しました'); render(data); }
    function render(data) { const first = new Date(data.from); const cells = Array.from({length: 7}, (_, index) => { const date = new Date(first); date.setDate(first.getDate() + index); return date; }); let html = '<div class="week"><div class="cell head"></div>' + cells.map((date) => `<div class="cell head">${days[date.getDay()]} ${date.getMonth()+1}/${date.getDate()}</div>`).join(''); for (let hour = 0; hour < 24; hour++) { html += `<div class="cell hour">${String(hour).padStart(2,'0')}:00 ${escapeHtml(timezoneName)}</div>` + cells.map((date) => { const items = data.sessions.filter((session) => { const start = new Date(session.start); return start.getFullYear() === date.getFullYear() && start.getMonth() === date.getMonth() && start.getDate() === date.getDate() && start.getHours() === hour; }); return `<div class="cell">${items.map((session) => `<div class="session" data-id="${escapeHtml(session.id)}" role="button" tabindex="0"><strong>${escapeHtml(session.title || '(無題)')}</strong><small>${escapeHtml(session.project)} · ${escapeHtml(session.status)}</small></div>`).join('')}</div>`; }).join(''); } calendar.innerHTML = html + '</div>'; meta.textContent = `${data.sessions.length} sessions · ${timezoneName}${data.truncated ? ' · 5000件で打ち切り' : ''}${data.degraded ? ' · status degraded' : ''}`; document.querySelectorAll('.session').forEach((item) => { const open = () => show(item.dataset.id).catch((error) => { meta.textContent = error.message; }); item.onclick = open; item.onkeydown = (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } }; }); }
    function formatNumber(value) { return typeof value === 'number' && Number.isFinite(value) ? value.toLocaleString() : '-'; }
    function formatDate(value) { if (typeof value !== 'number' || !Number.isFinite(value)) return '-'; const date = new Date(value); return Number.isNaN(date.getTime()) ? '-' : `${date.toLocaleString('ja-JP', { timeZone: timezoneName })} ${timezoneName}`; }
    function duration(info) { const time = info?.time || {}; if (typeof time.created !== 'number' || typeof time.updated !== 'number' || !Number.isFinite(time.created) || !Number.isFinite(time.updated)) return '-'; return `${Math.max(0, Math.round((time.updated - time.created) / 60000))}分`; }
    function partText(part) { if (!part || typeof part !== 'object') return ''; if (part.type === 'text' || part.type === 'reasoning') return typeof part.text === 'string' ? part.text : ''; if (part.type === 'tool') return `${part.tool || 'tool'} (${part.state?.status || 'unknown'})`; return ''; }
    function detailHtml(data) { const info = data.export?.info || {}; const messages = Array.isArray(data.export?.messages) ? data.export.messages.filter((message) => message && typeof message === 'object') : []; const tokens = info.tokens && typeof info.tokens === 'object' ? info.tokens : {}; const cache = tokens.cache && typeof tokens.cache === 'object' ? tokens.cache : {}; const summary = info.summary && typeof info.summary === 'object' ? info.summary : {}; const validParts = (message) => Array.isArray(message.parts) ? message.parts.filter((part) => part && typeof part === 'object') : []; const tools = messages.flatMap((message) => validParts(message).filter((part) => part.type === 'tool').map((part) => part.tool || 'tool')); const visibleMessages = messages.slice(-30); const timeline = visibleMessages.flatMap((message) => { const role = message.info?.role || 'unknown'; return validParts(message).map((part) => { const text = partText(part); if (!text) return ''; const cls = part.type === 'tool' ? 'tool' : role; return `<div class="event ${escapeHtml(cls)}"><div class="event-title">${escapeHtml(part.type === 'tool' ? 'Tool' : role)} <span class="muted">${escapeHtml(part.type || 'event')}</span></div><div class="event-text">${escapeHtml(text)}</div></div>`; }).filter(Boolean); }).join(''); const model = info.model ? `${info.model.providerID || '-'}/${info.model.id || '-'}` : `${info.providerID || '-'}${info.modelID ? `/${info.modelID}` : ''}`; return `<div class="detail-head"><div><h2>${escapeHtml(info.title || info.id || data.id)}</h2><div class="muted">${escapeHtml(info.directory || '')}</div></div><button onclick="detail.close()">閉じる</button></div><div class="stats"><div class="stat">状態<b>${escapeHtml(info.time?.archived ? 'archived' : 'done')}</b></div><div class="stat">期間<b>${duration(info)}</b></div><div class="stat">コスト<b>${money(info.cost)}</b></div><div class="stat">メッセージ<b>${formatNumber(messages.length)}</b></div><div class="stat">入力 tokens<b>${formatNumber(tokens.input)}</b></div><div class="stat">出力 tokens<b>${formatNumber(tokens.output)}</b></div><div class="stat">Cache read<b>${formatNumber(cache.read)}</b></div><div class="stat">Tool calls<b>${formatNumber(tools.length)}</b></div></div><div class="detail-section"><h3>セッション情報</h3><div class="muted">開始: ${formatDate(info.time?.created)}<br>更新: ${formatDate(info.time?.updated)}<br>モデル: ${escapeHtml(model)}<br>Agent: ${escapeHtml(info.agent || '-')}<br>変更: +${formatNumber(summary.additions)} / -${formatNumber(summary.deletions)} · ${formatNumber(summary.files)} files</div></div><div class="detail-section"><h3>会話・実行タイムライン（最新30件）</h3><div class="timeline">${messages.length > 30 ? '<div class="muted">古いイベントは省略しています</div>' : ''}${timeline || '<div class="muted">表示できるイベントはありません</div>'}</div></div><div class="detail-section"><h3>使用ツール</h3><div class="muted">${tools.length ? tools.map(escapeHtml).join(' · ') : 'なし'}</div></div><details><summary>Raw export JSON</summary><pre>${escapeHtml(JSON.stringify(data.export, null, 2))}</pre></details>`; }
    async function show(id) { try { const response = await fetch(serviceBase + '/api/sessions/' + encodeURIComponent(id)); const data = await response.json(); if (!response.ok) throw new Error(data.error || '詳細の取得に失敗しました'); body.innerHTML = detailHtml(data); detail.showModal(); } catch (error) { meta.textContent = error.message || '詳細の取得に失敗しました'; } }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
    document.querySelector('#reload').onclick = () => load().catch((error) => { meta.textContent = error.message; }); load().catch((error) => { meta.textContent = error.message; });
  </script>
</body>
</html>
