<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode Calendar</title>
  <style>
    :root { color-scheme: dark; --bg: #111318; --panel: #1b1f29; --line: #303747; --ink: #e9edf5; --muted: #98a2b3; --accent: #8ed0ff; }
    * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; }
    header { padding: 22px 28px 14px; border-bottom: 1px solid var(--line); } h1 { margin: 0 0 6px; font-size: 22px; } p { color: var(--muted); margin: 0; }
    main { padding: 22px 0; overflow-x: auto; } .toolbar { display: flex; gap: 12px; margin-bottom: 18px; align-items: center; padding: 0 28px; flex-wrap: wrap; } select, button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; } button:disabled { cursor: wait; opacity: .6; }
    .week { min-width: 870px; display: grid; grid-template-columns: 100px repeat(7, minmax(110px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .cell { min-height: 72px; position: relative; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; } .week.duration .cell { height: 72px; } .head, .week.duration .head { height: auto; min-height: auto; color: var(--accent); font-weight: 650; text-align: center; } .hour { color: var(--muted); text-align: right; position: sticky; left: 0; z-index: 2; width: 100px; min-width: 100px; padding-left: 36px; background: var(--bg); box-shadow: 6px 0 10px rgba(17, 19, 24, .9); } .week > .head:first-child { position: sticky; left: 0; z-index: 3; width: 100px; min-width: 100px; padding-left: 36px; background: var(--bg); box-shadow: 6px 0 10px rgba(17, 19, 24, .9); }
    .week > .head:not(:first-child), .week > .cell:not(.hour):not(.head) { border-left: 2px solid #4b5870; } .week > .head:first-child, .week > .hour { border-right: 2px solid #4b5870; }
    .session { display: block; margin: 4px 0; padding: 7px; border-left: 3px solid var(--session-color, var(--accent)); border-radius: 4px; background: var(--session-bg, #23364a); cursor: pointer; } .session.duration { position: absolute; left: 6px; right: 6px; margin: 0; min-height: 24px; overflow: hidden; z-index: 1; } .session:focus { outline: 2px solid var(--accent); outline-offset: 2px; } .session strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .session small { color: #b9d6e8; }
    .display-toggle { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: 180px; height: 40px; padding: 3px; border-radius: 999px; background: var(--panel); overflow: hidden; isolation: isolate; } .display-toggle::before { position: absolute; content: ''; inset: 3px auto 3px 3px; width: calc(50% - 3px); border-radius: 999px; background: var(--accent); transition: transform .2s ease; z-index: -1; } .display-toggle.duration::before { transform: translateX(100%); } .display-toggle span { display: grid; place-items: center; z-index: 1; color: var(--muted); font-weight: 650; } .display-toggle:not(.duration) span:first-child, .display-toggle.duration span:last-child { color: #101820; }
    dialog { max-width: 920px; width: calc(100% - 32px); max-height: min(90vh, calc(100dvh - 32px)); overflow-y: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 20px; } dialog::backdrop { background: #0009; }
    .detail-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 18px; } .detail-head h2 { margin: 0 0 6px; } .muted { color: var(--muted); }
    body.modal-open { overflow: hidden; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 14px 0 20px; } .stat { padding: 12px; background: #151923; border: 1px solid var(--line); border-radius: 7px; } .stat b { display: block; font-size: 18px; margin-top: 4px; }
    .detail-section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; } .detail-section h3 { margin: 0 0 10px; font-size: 14px; color: var(--accent); } .identity-row { display: flex; gap: 10px; margin: 7px 0; } .identity-label { flex: 0 0 110px; color: var(--muted); } .identity-value { min-width: 0; overflow-wrap: anywhere; }
    .timeline { display: grid; gap: 8px; max-height: 36vh; overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; } .event { padding: 10px 12px; border-left: 3px solid #56647a; background: #151923; border-radius: 4px; } .event.user { border-left-color: #b7e986; } .event.assistant { border-left-color: var(--accent); } .event.tool { border-left-color: #e5b86f; } .event-title { font-weight: 650; } .event-text { margin-top: 6px; color: var(--muted); white-space: pre-wrap; max-height: 140px; overflow: auto; overscroll-behavior: contain; }
    .loading { display: flex; align-items: center; gap: 12px; padding: 28px 8px; color: var(--muted); } .spinner { width: 20px; height: 20px; border: 3px solid #435066; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
    details { margin-top: 16px; } details pre { white-space: pre-wrap; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header><h1>OpenCode Calendar</h1><p>ローカルのOpenCodeセッションを読み取り専用で表示</p></header>
  <main><div class="toolbar"><button id="previous" aria-label="前週">&lt;&lt;</button><button id="current">今週</button><button id="next" aria-label="次週">&gt;&gt;</button><button id="displayModeToggle" class="display-toggle" aria-pressed="false" aria-label="期間表示へ切り替え"><span>開始時刻</span><span>期間</span></button><button id="reload">再読み込み</button><span id="loading" role="status" aria-live="polite" hidden>読み込み中…</span><span id="meta">読み込み中...</span></div><div id="calendar" aria-busy="true"></div></main>
  <dialog id="detail" aria-labelledby="detail-title"><div id="detail-body"></div></dialog>
  <script>
    const calendar = document.querySelector('#calendar'), meta = document.querySelector('#meta'), loading = document.querySelector('#loading'), detail = document.querySelector('#detail'), body = document.querySelector('#detail-body');
    const days = ['日','月','火','水','木','金','土'];
    const columnColors = ['#70b7ff', '#b58cff', '#ff8f9c', '#f2c572', '#71d6b0', '#e68cff', '#8dd3c7'];
    let weekDate = dayStart(new Date());
    let displayMode = 'start';
    let calendarData = null;
    function money(value) { return typeof value === 'number' && Number.isFinite(value) ? `$${value.toFixed(2)}` : '-'; }
    const serviceBase = location.pathname.startsWith('/api/extensions/') ? location.pathname.replace(/\/ui\/?$/, '/service') : '';
    const timezoneName = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    let loadRequest = 0;
    function dayStart(date) { const copy = new Date(date); copy.setHours(0,0,0,0); const day = copy.getDay() || 7; copy.setDate(copy.getDate() - day + 1); return copy; }
    function dateParam() { return `${weekDate.getFullYear()}-${String(weekDate.getMonth() + 1).padStart(2, '0')}-${String(weekDate.getDate()).padStart(2, '0')}`; }
    async function load() { const request = ++loadRequest; setLoading(true); try { const response = await fetch(serviceBase + '/api/calendar?timezone=' + encodeURIComponent(timezoneName) + '&date=' + dateParam()); const data = await response.json(); if (request !== loadRequest) return false; if (!response.ok) throw new Error(data.error || '取得に失敗しました'); render(data); return true; } catch (error) { if (request === loadRequest) throw error; return false; } finally { if (request === loadRequest) setLoading(false); } }
    function setLoading(active) { loading.hidden = !active; calendar.setAttribute('aria-busy', String(active)); ['previous', 'current', 'next', 'displayModeToggle', 'reload'].forEach((id) => { document.querySelector(`#${id}`).disabled = active; }); }
    function dateKey(date) { return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`; }
    function columnStyle(column) { const color = columnColors[column % columnColors.length] || columnColors[0]; return `--session-color:${color};--session-bg:color-mix(in srgb, ${color} 28%, #23364a);`; }
    function wallClockMs(date) { return Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), date.getHours(), date.getMinutes(), date.getSeconds(), date.getMilliseconds()); }
    function durationSegments(session, weekStart, weekEnd) { const rawStart = new Date(session.start), rawEnd = new Date(session.end); if (Number.isNaN(rawStart.getTime()) || Number.isNaN(rawEnd.getTime()) || rawEnd <= rawStart) return []; const start = rawStart < weekStart ? weekStart : rawStart, end = rawEnd > weekEnd ? weekEnd : rawEnd; const segments = []; let day = new Date(start); day.setHours(0, 0, 0, 0); while (day < end) { const nextDay = new Date(day); nextDay.setDate(nextDay.getDate() + 1); const segmentStart = start > day ? start : day; const segmentEnd = end < nextDay ? end : nextDay; segments.push({ date: dateKey(day), hour: segmentStart.getHours(), startTime: segmentStart.getTime(), endTime: segmentEnd.getTime(), top: (segmentStart.getMinutes() / 60) * 72, height: Math.max(24, (wallClockMs(segmentEnd) - wallClockMs(segmentStart)) / 3600000 * 72) }); day = nextDay; } return segments; }
    function sessionMarkup(session, segment) { const title = session.title || '(無題)'; const layout = segment ? `${columnStyle(segment.lane)}top:${segment.top}px;height:${segment.height}px;left:${(segment.lane * 100 / segment.laneCount).toFixed(3)}%;width:${(100 / segment.laneCount).toFixed(3)}%;right:auto;box-sizing:border-box;` : ''; return `<div class="session${segment ? ' duration' : ''}"${segment ? ` style="${layout}"` : ''} data-id="${escapeHtml(session.id)}" data-title="${escapeHtml(title)}" role="button" tabindex="0"><strong>${escapeHtml(title)}</strong><small>${escapeHtml(session.project)} · ${escapeHtml(session.status)}</small></div>`; }
    function render(data) { calendarData = data; const first = new Date(data.from); const weekEnd = new Date(first); weekEnd.setDate(weekEnd.getDate() + 7); const cells = Array.from({length: 7}, (_, index) => { const date = new Date(first); date.setDate(first.getDate() + index); return date; }); const durationIndex = new Map(); if (displayMode === 'duration') { const segmentsByDate = new Map(); data.sessions.forEach((session) => durationSegments(session, first, weekEnd).forEach((segment) => { const items = segmentsByDate.get(segment.date) || []; items.push({session, segment}); segmentsByDate.set(segment.date, items); })); segmentsByDate.forEach((items) => { const lanes = []; items.sort((left, right) => left.segment.startTime - right.segment.startTime || left.segment.endTime - right.segment.endTime); items.forEach(({segment}) => { const visualEndTime = Math.max(segment.endTime, segment.startTime + 20 * 60 * 1000); let lane = lanes.findIndex((endTime) => endTime <= segment.startTime); if (lane < 0) { lane = lanes.length; lanes.push(visualEndTime); } else { lanes[lane] = visualEndTime; } segment.lane = lane; }); items.forEach(({session, segment}) => { segment.laneCount = lanes.length; const key = `${segment.date}:${segment.hour}`; const cellItems = durationIndex.get(key) || []; cellItems.push({session, segment}); durationIndex.set(key, cellItems); }); }); } let html = `<div class="week ${displayMode}"><div class="cell head"></div>` + cells.map((date) => `<div class="cell head">${date.getMonth()+1}/${date.getDate()} (${days[date.getDay()]})</div>`).join(''); for (let hour = 0; hour < 24; hour++) { html += `<div class="cell hour">${String(hour).padStart(2,'0')}:00</div>` + cells.map((date) => { const key = dateKey(date); const items = displayMode === 'start' ? data.sessions.filter((session) => { const start = new Date(session.start); return dateKey(start) === key && start.getHours() === hour; }).map((session) => sessionMarkup(session)) : (durationIndex.get(`${key}:${hour}`) || []).map(({session, segment}) => sessionMarkup(session, segment)); return `<div class="cell">${items.join('')}</div>`; }).join(''); } calendar.innerHTML = html + '</div>'; meta.textContent = `${data.sessions.length} sessions · ${timezoneName}${displayMode === 'duration' ? ' · 期間表示' : ''}${data.truncated ? ' · 5000件で打ち切り' : ''}${data.degraded ? ' · status degraded' : ''}`; document.querySelectorAll('.session').forEach((item) => { const open = () => show(item.dataset.id, item.dataset.title); item.onclick = open; item.onkeydown = (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } }; }); }
    function formatNumber(value) { return typeof value === 'number' && Number.isFinite(value) ? value.toLocaleString() : '-'; }
    function formatDate(value) { if (typeof value !== 'number' || !Number.isFinite(value)) return '-'; const date = new Date(value); return Number.isNaN(date.getTime()) ? '-' : `${date.toLocaleString('ja-JP', { timeZone: timezoneName })} ${timezoneName}`; }
    function duration(info) { const time = info?.time || {}; if (typeof time.created !== 'number' || typeof time.updated !== 'number' || !Number.isFinite(time.created) || !Number.isFinite(time.updated)) return '-'; return `${Math.max(0, Math.round((time.updated - time.created) / 60000))}分`; }
    function partText(part) { if (!part || typeof part !== 'object') return ''; if (part.type === 'text' || part.type === 'reasoning') return typeof part.text === 'string' ? part.text : ''; if (part.type === 'tool') return `${part.tool || 'tool'} (${part.state?.status || 'unknown'})`; return ''; }
    function detailHtml(data) { const info = data.export?.info || {}; const messages = Array.isArray(data.export?.messages) ? data.export.messages.filter((message) => message && typeof message === 'object') : []; const tokens = info.tokens && typeof info.tokens === 'object' ? info.tokens : {}; const cache = tokens.cache && typeof tokens.cache === 'object' ? tokens.cache : {}; const summary = info.summary && typeof info.summary === 'object' ? info.summary : {}; const validParts = (message) => Array.isArray(message.parts) ? message.parts.filter((part) => part && typeof part === 'object') : []; const tools = messages.flatMap((message) => validParts(message).filter((part) => part.type === 'tool').map((part) => part.tool || 'tool')); const visibleMessages = messages.slice(-30); const timeline = visibleMessages.flatMap((message) => { const role = message.info?.role || 'unknown'; return validParts(message).map((part) => { const text = partText(part); if (!text) return ''; const cls = part.type === 'tool' ? 'tool' : role; return `<div class="event ${escapeHtml(cls)}"><div class="event-title">${escapeHtml(part.type === 'tool' ? 'Tool' : role)} <span class="muted">${escapeHtml(part.type || 'event')}</span></div><div class="event-text">${escapeHtml(text)}</div></div>`; }).filter(Boolean); }).join(''); const model = info.model ? `${info.model.providerID || '-'}/${info.model.id || '-'}` : `${info.providerID || '-'}${info.modelID ? `/${info.modelID}` : ''}`; const title = typeof info.title === 'string' && info.title ? info.title : '(無題)'; const directory = typeof info.directory === 'string' ? info.directory : '-'; const directoryName = directory === '-' ? '-' : directory.replace(/[\\/]$/, '').split(/[\\/]/).pop() || directory; const identity = `<div class="detail-section identity"><h3>セッション情報</h3><div class="identity-row"><span class="identity-label">タイトル</span><span class="identity-value">${escapeHtml(title)}</span></div><div class="identity-row"><span class="identity-label">ディレクトリ名</span><span class="identity-value">${escapeHtml(directoryName)}</span></div><div class="identity-row"><span class="identity-label">フルパス</span><span class="identity-value">${escapeHtml(directory)}</span></div><div class="identity-row"><span class="identity-label">Session ID</span><span class="identity-value">${escapeHtml(info.id || data.id || '-')}</span></div><div class="identity-row"><span class="identity-label">期間</span><span class="identity-value">${formatDate(info.time?.created)} ~ ${formatDate(info.time?.updated)}</span></div><div class="identity-row"><span class="identity-label">モデル</span><span class="identity-value">${escapeHtml(model)}</span></div><div class="identity-row"><span class="identity-label">Agent</span><span class="identity-value">${escapeHtml(info.agent || '-')}</span></div><div class="identity-row"><span class="identity-label">変更</span><span class="identity-value">+${formatNumber(summary.additions)} / -${formatNumber(summary.deletions)} · ${formatNumber(summary.files)} files</span></div></div>`; return `<div class="detail-head"><div><h2 id="detail-title">${escapeHtml(title)}</h2></div><button type="button" onclick="detail.close()">閉じる</button></div>${identity}<div class="stats"><div class="stat">状態<b>${escapeHtml(info.time?.archived ? 'archived' : 'done')}</b></div><div class="stat">期間<b>${duration(info)}</b></div><div class="stat">コスト<b>${money(info.cost)}</b></div><div class="stat">メッセージ<b>${formatNumber(messages.length)}</b></div><div class="stat">入力 tokens<b>${formatNumber(tokens.input)}</b></div><div class="stat">出力 tokens<b>${formatNumber(tokens.output)}</b></div><div class="stat">Cache read<b>${formatNumber(cache.read)}</b></div><div class="stat">Tool calls<b>${formatNumber(tools.length)}</b></div></div><div class="detail-section"><h3>会話・実行タイムライン（最新30件）</h3><div class="timeline">${messages.length > 30 ? '<div class="muted">古いイベントは省略しています</div>' : ''}${timeline || '<div class="muted">表示できるイベントはありません</div>'}</div><div class="detail-section"><h3>使用ツール</h3><div class="muted">${tools.length ? tools.map(escapeHtml).join(' · ') : 'なし'}</div></div><details><summary>Raw export JSON</summary><pre>${escapeHtml(JSON.stringify(data.export, null, 2))}</pre></details>`; }
    let detailRequest = 0;
    async function show(id, title) { const request = ++detailRequest; body.innerHTML = `<div class="detail-head"><div><h2 id="detail-title">${escapeHtml(title || 'セッション詳細')}</h2><div class="loading" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>詳細を取得中…</span></div></div><button type="button" onclick="detail.close()">閉じる</button></div>`; document.body.classList.add('modal-open'); if (!detail.open) detail.showModal(); try { const response = await fetch(serviceBase + '/api/sessions/' + encodeURIComponent(id)); const data = await response.json(); if (request !== detailRequest) return; if (!response.ok) throw new Error(data.error || '詳細の取得に失敗しました'); body.innerHTML = detailHtml(data); const heading = body.querySelector('h2'); if (heading) heading.id = 'detail-title'; } catch (error) { if (request !== detailRequest) return; body.innerHTML = `<div class="detail-head"><div><h2 id="detail-title">${escapeHtml(title || 'セッション詳細')}</h2><div class="loading" role="alert"><span>詳細の取得に失敗しました: ${escapeHtml(error.message || '不明なエラー')}</span></div></div><button type="button" onclick="detail.close()">閉じる</button></div>`; } }
    detail.addEventListener('close', () => document.body.classList.remove('modal-open'));
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
    function moveWeek(days) { const previousDate = new Date(weekDate); weekDate.setDate(weekDate.getDate() + days); load().catch((error) => { weekDate = previousDate; meta.textContent = error.message; }); }
    document.querySelector('#previous').onclick = () => moveWeek(-7);
    document.querySelector('#current').onclick = () => { const previousDate = weekDate; weekDate = dayStart(new Date()); load().catch((error) => { weekDate = previousDate; meta.textContent = error.message; }); };
    document.querySelector('#next').onclick = () => moveWeek(7);
    function setDisplayMode(mode) { displayMode = mode; const toggle = document.querySelector('#displayModeToggle'); const duration = mode === 'duration'; toggle.classList.toggle('duration', duration); toggle.setAttribute('aria-pressed', String(duration)); toggle.setAttribute('aria-label', duration ? '開始時刻表示へ切り替え' : '期間表示へ切り替え'); if (calendarData) render(calendarData); }
    document.querySelector('#displayModeToggle').onclick = () => setDisplayMode(displayMode === 'start' ? 'duration' : 'start');
    document.querySelector('#reload').onclick = () => load().catch((error) => { meta.textContent = error.message; }); load().catch((error) => { meta.textContent = error.message; });
  </script>
</body>
</html>
